# If you screw this up, run `picom` from a terminal and it'll tell you what's wrong.

backend = "glx";
vsync = true;

rules: ({
    match = "class_g = 'Pcmanfm'            ||"
            "class_g = 'SpeedCrunch'        ||"
            "_GTK_FRAME_EXTENTS@";
    opacity = 0.85;
},{
    match = "window_type = 'notification'   ||"
            "window_type = 'dropdown_menu'  ||"
            "window_type = 'popup_menu'     ||"
            "window_type = 'tooltip'        ||"
            "_GTK_FRAME_EXTENTS@";
    shadow = false;
    opacity = 1;
})

